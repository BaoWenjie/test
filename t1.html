<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Checkout Demo</title>
    <script src="https://www.paypal.com/sdk/js?client-id=AZofHmeTRxP_ig8krgBTZk2AA8-DRTdjO9ymeWFNh1w-_pPIGq4QizpfhwLEKmO8JqIyh1gzB51KLBMR&locale=en_US"></script>
</head>
<body>

<h1>PayPal Checkout Demo</h1>
<div id="paypal-button-container"></div>

<script>
    paypal.Buttons({
        // 创建订单
        createOrder: function (data, actions) {
            return actions.order.create({
                purchase_units: [{
                    amount: {
                        value: '0.1' // 订单金额
                    }
                }]
            });
        },
        // 订单批准后的回调
        onApprove: function (data, actions) {
            return actions.order.capture().then(function (details) {
                alert('支付成功！谢谢, ' + details.payer.name.given_name);
                // 在此处重定向用户到结果页面
                // window.location.href = 'result_page.html';
            });
        },
        // 提供 Apple Pay 和 Google Pay 支付选项
        funding: {
            allowed: [paypal.FUNDING.CARD, paypal.FUNDING.PAYPAL, paypal.FUNDING.APPLEPAY, paypal.FUNDING.GOOGLEPAY],
            disallowed: []
        }
    }).render('#paypal-button-container'); // 渲染按钮到指定容器
</script>

</body>
</html>
